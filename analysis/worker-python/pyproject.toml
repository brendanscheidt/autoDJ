[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autodj-analysis"
version = "0.1.0"
description = "Offline analysis worker stub for the AutoDJ foundation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
analysis = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<2.0",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12,<0.14",
    "audioread>=3.0,<4.0"
]
analysis-wsl = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<2.0",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12,<0.14",
    "audioread>=3.0,<4.0",
    "essentia>=2.1b6.dev1389,<2.2"
]
analysis-candidates = [
    "audioflux>=0.1.9,<0.2",
    "mir_eval>=0.8,<0.9",
    "pyAudioAnalysis>=0.3.14,<0.4"
]
beat-this = [
    "beat-this>=1.1,<1.2",
    "torch>=2.12,<2.13",
    "torchaudio>=2.11,<2.12"
]
all-in-one = [
    "allin1>=1.1,<1.2",
    "torch>=2.12,<2.13",
    "torchaudio>=2.11,<2.12",
    "torchcodec>=0.12,<0.13",
    "natten==0.21.6",
    "cmake>=4.3,<4.4; platform_system == 'Linux'",
    "ninja>=1.13,<1.14; platform_system == 'Linux'",
    "nvidia-cuda-runtime==13.0.96; platform_system == 'Linux'",
    "nvidia-cuda-nvcc==13.0.88; platform_system == 'Linux'",
    "nvidia-cuda-crt==13.0.88; platform_system == 'Linux'",
    "nvidia-nvvm==13.0.88; platform_system == 'Linux'",
    "nvidia-cuda-cccl==13.0.85; platform_system == 'Linux'",
    "madmom @ git+https://github.com/CPJKU/madmom"
]
songformer = [
    "transformers>=4.51,<4.52",
    "huggingface-hub>=0.30,<0.31",
    "torch>=2.12,<2.13",
    "torchaudio>=2.11,<2.12",
    "torchvision>=0.27,<0.28",
    "torchcodec>=0.12,<0.13",
    "safetensors>=0.5,<0.6",
    "librosa>=0.11,<0.12",
    "ema-pytorch>=0.7,<0.8",
    "x-transformers>=2.19,<2.20",
    "omegaconf>=2.3,<2.4",
    "loguru>=0.7,<0.8",
    "muq>=0.1,<0.2",
    "msaf>=0.1.80,<0.2"
]
cue-detr = [
    "transformers>=4.51,<4.52",
    "huggingface-hub>=0.30,<0.31",
    "torch>=2.12,<2.13",
    "torchvision>=0.27,<0.28",
    "timm>=1.0.7,<1.1",
    "librosa>=0.11,<0.12",
    "matplotlib>=3.8,<3.11",
    "pillow>=10,<13",
    "scipy>=1.11,<2.0",
    "numpy>=1.26,<2.0"
]
edm98 = [
    "edm98[inference]>=0.1,<0.2",
    "muq @ git+https://github.com/tencent-ailab/MuQ.git"
]

[project.scripts]
autodj-analysis = "autodj_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "analysis: optional core analysis dependency smoke tests",
    "analysis_wsl: WSL/Linux analysis dependency smoke tests",
    "analysis_candidate: optional exploratory MIR backend smoke tests"
]
